---

- name: Install util-linux package
  ansible.builtin.package:
    name: util-linux
    state: present

- name: Check swap file size
  ansible.builtin.stat:
    path: /swapfile
    get_checksum: false
  register: swap_file

- name: Disable swap
  command: swapoff -a
  become: true
  when: swap_file.stat.exists and swap_file.stat.size != (swap_size_gb * 1024 ** 3)

- name: Delete swap file
  file:
    path: /swapfile
    state: absent
  when: swap_file.stat.exists and swap_file.stat.size != (swap_size_gb * 1024 ** 3)

- name: Create swap file
  ansible.builtin.command:
    cmd: fallocate -l {{ swap_size_gb }}G /swapfile
    creates: /swapfile
  register: swap_created

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format the file as swap
  ansible.builtin.command: mkswap /swapfile
  when: swap_created.changed

- name: Enable the swap file
  ansible.builtin.command: swapon /swapfile
  when: swap_created.changed

- name: Add swap file to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Check swap status
  ansible.builtin.command: swapon --show
  register: swap_status
  changed_when: false
