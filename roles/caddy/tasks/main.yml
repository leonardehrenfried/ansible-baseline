---
- name: Install caddy from backports
  when: ansible_facts["distribution"] == 'Debian'
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
    default_release: "{{ ansible_facts['distribution_release'] }}-backports"

- name: Install caddy
  when: ansible_facts["distribution"] != 'Debian'
  ansible.builtin.package:
    name:
      - caddy

- name: Start systemd service
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
    daemon_reload: yes
  with_items:
    - caddy.service
