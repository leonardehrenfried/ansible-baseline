---
tileserver_version: "v5.4.0"
tileserver_work_dir: "/var/tileserver/"
tileserver_cache_dir: "{{ tileserver_work_dir }}/cache/"
tileserver_port: 5000
tileserver_cache_port: 5001
tileserver_allowed_referrers:
  - "{{ tileserver_domain }}"
tileserver_tile_margin: 50
tileserver_cache_settings:
  - location_regex: '/styles/.*\.png$'
    server_cache: "1d"
    browser_cache: 3600
    error_handling: "/unauthorized.png"
  - location_regex: '/data/.*\.pbf$'
    server_cache: "15m"
    browser_cache: 3600
    error_handling: "@unauthorized_pbf"
# extra styles to be deployed
# place in ./templates/tileserver/foo.json
tileserver_extra_styles: []
tileserver_extra_sources: []
tileserver_planned_restart: true
tileserver_restart_time: "06:00:00"
tileserver_restart_on_change: true

tileserver_mbtiles_path: "{{ tilemaker_work_dir }}/tilemaker-output.mbtiles"

streets_serve_rendered: true
bicycle_serve_rendered: true
satellite_overlay_serve_rendered: true
